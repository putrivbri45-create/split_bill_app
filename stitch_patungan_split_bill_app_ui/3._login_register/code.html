<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>

</head>
<body class="bg-background text-on-surface antialiased min-h-screen flex flex-col justify-between selection:bg-secondary-container selection:text-on-secondary-fixed">
<!-- Dynamic Top Bar as per Shared Components Spec (Linear flow suppresses bottom nav shell) -->
<header class="bg-surface text-primary shadow-sm flex justify-between items-center w-full px-margin md:px-margin-tablet h-14 z-20">
<button aria-label="Kembali" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="flex items-center gap-2">
<span class="text-headline-sm font-headline-sm font-bold text-primary tracking-tight">Patungan</span>
</div>
<button aria-label="Bantuan dan Pengaturan" class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container text-on-surface-variant active:scale-95 transition-transform duration-150" type="button">
<span class="material-symbols-outlined" data-icon="help_outline">help_outline</span>
</button>
</header>
<!-- Main Authenticated Flow Container -->
<main class="w-full flex-grow flex items-center justify-center px-margin py-6 md:py-10">
<div class="w-full max-w-md mx-auto">
<!-- App Identity / Header Section -->
<div class="text-center mb-6">
<div class="inline-flex items-center justify-center p-2 rounded-2xl bg-surface-container-lowest shadow-sm mb-3">
<img alt="Logo Patungan" class="w-16 h-16 object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida/AEtjO1WHI2ArbUI0td3htktJB54Hovr2x-JhTaIWGATV7NViWN_f0cEnnR5djyHgCh252g8QXHJMiyVQJ1xHt5ieETaCpD7rYvuS6b85IReoCKsAwQGh2zX2ry6UpugOjRsme49MH8zKKBKepBfv78pWwR2iJUv16JJDMBwaUEVhaNvsjvNU1EJvHjNznEjUNTo8Dd_54W-RU5zcKSIiU7_Vh0wJHvMXFyGPkUmesTyTHESj2En3jI6q0M2Q8Evq"/>
</div>
<h1 class="text-headline-lg font-headline-lg text-on-surface font-bold tracking-tight">Patungan</h1>
<p class="text-body-md font-body-md text-on-surface-variant mt-1 font-medium">Biar adil, nggak ribet.</p>
</div>
<!-- Surface Card -->
<div class="bg-surface-container-lowest rounded-2xl p-6 shadow-sm border border-surface-container-high transition-all duration-300">
<!-- Segmented Tab Switcher -->
<div class="flex p-1 bg-surface-container rounded-xl mb-6 relative">
<button class="flex-1 py-2 text-center text-label-lg font-label-lg rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary font-bold shadow-sm" id="tab-login" onclick="switchAuthMode('login')">
            Masuk
          </button>
<button class="flex-1 py-2 text-center text-label-lg font-label-lg rounded-lg transition-all duration-200 text-on-surface-variant font-medium hover:text-on-surface" id="tab-register" onclick="switchAuthMode('register')">
            Daftar
          </button>
</div>
<!-- Form Element -->
<form class="space-y-4" id="auth-form" onsubmit="event.preventDefault();">
<!-- Register Exclusive Fields (Hidden by default, smooth appearance) -->
<div class="hidden space-y-4" id="register-fields">
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1 font-medium" for="reg-name">Nama Lengkap</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none" data-icon="person">person</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="reg-name" placeholder="Nama sesuai KTP/e-Wallet" type="text"/>
</div>
</div>
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1 font-medium" for="reg-phone">No. WhatsApp / HP</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none" data-icon="call">call</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="reg-phone" placeholder="081234567890" type="tel"/>
</div>
</div>
</div>
<!-- Common/Login Input 1: Email / No HP -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1 font-medium" for="auth-identifier">Email atau Nomor HP</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none" data-icon="mail">mail</span>
<input class="w-full h-12 pl-11 pr-4 bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="auth-identifier" placeholder="contoh@email.com" type="text"/>
</div>
</div>
<!-- Common/Login Input 2: Password -->
<div>
<label class="block text-label-md font-label-md text-on-surface-variant mb-1 font-medium" for="auth-password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none" data-icon="lock">lock</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="auth-password" placeholder="Minimal 8 karakter" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-outline hover:text-on-surface p-1 focus:outline-none" onclick="togglePasswordVisibility('auth-password', 'eye-icon-1')" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" id="eye-icon-1">visibility</span>
</button>
</div>
</div>
<!-- Register Exclusive Field: Confirm Password -->
<div class="hidden" id="register-confirm-password">
<label class="block text-label-md font-label-md text-on-surface-variant mb-1 font-medium" for="reg-password-confirm">Konfirmasi Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3.5 text-outline text-xl pointer-events-none" data-icon="verified_user">verified_user</span>
<input class="w-full h-12 pl-11 pr-11 bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md font-body-md text-on-surface placeholder:text-outline-variant focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all" id="reg-password-confirm" placeholder="Ulangi password" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3.5 text-outline hover:text-on-surface p-1 focus:outline-none" onclick="togglePasswordVisibility('reg-password-confirm', 'eye-icon-2')" type="button">
<span class="material-symbols-outlined text-xl" data-icon="visibility" id="eye-icon-2">visibility</span>
</button>
</div>
</div>
<!-- Meta row: Remember me & Forgot Password -->
<div class="flex items-center justify-between pt-1 pb-1" id="login-extras">
<label class="flex items-center gap-2 cursor-pointer select-none">
<input checked="" class="w-4 h-4 rounded text-primary focus:ring-primary border-outline-variant" type="checkbox"/>
<span class="text-body-sm font-body-sm text-on-surface-variant">Ingat saya</span>
</label>
<a class="text-body-sm font-body-sm font-semibold text-primary hover:underline" href="#">Lupa password?</a>
</div>
<!-- Primary CTA Button -->
<button class="w-full h-12 bg-primary-container hover:bg-emerald-600 text-on-primary rounded-2xl font-label-lg text-label-lg font-semibold shadow-md active:scale-[0.99] transition-all flex items-center justify-center gap-2" id="submit-btn" type="submit">
<span>Masuk</span>
<span class="material-symbols-outlined text-xl" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>

<!-- Toggle Sub-banner / Prompt -->
<div class="mt-6 pt-4 border-t border-surface-container text-center">
<p class="text-body-md font-body-md text-on-surface-variant" id="bottom-prompt-text">
            Belum punya akun? 
            <button class="text-primary font-bold hover:underline inline-flex items-center gap-0.5" onclick="switchAuthMode('register')" type="button">
<span>Daftar sekarang</span>
</button>
</p>
</div>
</div>
<!-- Quick Feature Trust Highlights -->
<div class="mt-6 grid grid-cols-3 gap-2 px-2 text-center text-on-surface-variant">
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1" data-icon="splitscreen">splitscreen</span>
<span class="text-label-sm font-label-sm font-semibold">Bagi Otomatis</span>
</div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1" data-icon="qr_code_scanner">qr_code_scanner</span>
<span class="text-label-sm font-label-sm font-semibold">Scan Struk</span>
</div>
<div class="flex flex-col items-center">
<span class="material-symbols-outlined text-primary mb-1" data-icon="verified">verified</span>
<span class="text-label-sm font-label-sm font-semibold">Aman &amp; Terbuka</span>
</div>
</div>
</div>
</main>
<!-- Legal & Micro Footer -->
<footer class="w-full py-4 text-center text-label-sm font-label-sm text-outline">
<p>© 2025 Patungan. Solusi bagi tagihan bersama.</p>
</footer>
<!-- Interactivity Script -->
<script>
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerText = 'visibility_off';
      } else {
        input.type = 'password';
        icon.innerText = 'visibility';
      }
    }

    function switchAuthMode(mode) {
      const tabLogin = document.getElementById('tab-login');
      const tabRegister = document.getElementById('tab-register');
      const regFields = document.getElementById('register-fields');
      const regConfirmPass = document.getElementById('register-confirm-password');
      const loginExtras = document.getElementById('login-extras');
      const submitBtn = document.getElementById('submit-btn');
      const bottomPrompt = document.getElementById('bottom-prompt-text');

      if (mode === 'register') {
        // Tab UI
        tabRegister.className = 'flex-1 py-2 text-center text-label-lg font-label-lg rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary font-bold shadow-sm';
        tabLogin.className = 'flex-1 py-2 text-center text-label-lg font-label-lg rounded-lg transition-all duration-200 text-on-surface-variant font-medium hover:text-on-surface';
        
        // Form Fields
        regFields.classList.remove('hidden');
        regConfirmPass.classList.remove('hidden');
        loginExtras.classList.add('hidden');
        
        // Button & Footer Text
        submitBtn.querySelector('span:first-child').innerText = 'Daftar Akun Baru';
        bottomPrompt.innerHTML = 'Sudah punya akun? <button type="button" onclick="switchAuthMode(\'login\')" class="text-primary font-bold hover:underline inline-flex items-center gap-0.5"><span>Masuk di sini</span></button>';
      } else {
        // Tab UI
        tabLogin.className = 'flex-1 py-2 text-center text-label-lg font-label-lg rounded-lg transition-all duration-200 bg-surface-container-lowest text-primary font-bold shadow-sm';
        tabRegister.className = 'flex-1 py-2 text-center text-label-lg font-label-lg rounded-lg transition-all duration-200 text-on-surface-variant font-medium hover:text-on-surface';
        
        // Form Fields
        regFields.classList.add('hidden');
        regConfirmPass.classList.add('hidden');
        loginExtras.classList.remove('hidden');
        
        // Button & Footer Text
        submitBtn.querySelector('span:first-child').innerText = 'Masuk';
        bottomPrompt.innerHTML = 'Belum punya akun? <button type="button" onclick="switchAuthMode(\'register\')" class="text-primary font-bold hover:underline inline-flex items-center gap-0.5"><span>Daftar sekarang</span></button>';
      }
    }
  </script>
</body></html>
